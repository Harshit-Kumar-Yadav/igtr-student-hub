<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignments | IGTR</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}body{background:#f4f7fb;color:#172033}.top{background:#0b1220;color:#cbd5e1;padding:11px 5%;font-size:12px;display:flex;justify-content:space-between}.nav{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#172033;font-weight:800}.brand-icon{width:40px;height:40px;border-radius:10px;background:#123c69;color:#fff;display:grid;place-items:center}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.navlinks a{background:#f1f5f9;color:#123c69;padding:9px 12px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700}.wrap{width:min(1180px,92%);margin:32px auto}.hero{background:linear-gradient(135deg,#102d4d,#123c69,#18578e);color:#fff;padding:35px;border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.12);margin-bottom:24px}.hero .eyebrow{font-size:11px;letter-spacing:1.6px;color:#b9dcfb;font-weight:800}.hero h1{font-size:clamp(28px,4vw,44px);margin:10px 0}.hero p{color:#dbeafe;line-height:1.7;max-width:780px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:22px;box-shadow:0 5px 18px rgba(0,0,0,.05);transition:.2s}.card:hover{transform:translateY(-3px);border-color:#2563eb}.card .icon{font-size:30px;margin-bottom:12px}.card h3{font-size:18px;margin-bottom:7px}.card p{font-size:13px;color:#64748b;line-height:1.6}.btn{display:inline-block;border:0;background:#123c69;color:#fff;padding:10px 15px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;cursor:pointer}.secondary{background:#eef4fa!important;color:#123c69!important}.section{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:22px;margin-top:20px}.section h2{font-size:21px;margin-bottom:15px}.muted{color:#64748b;font-size:13px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#475569}.field input{width:100%;padding:11px;border:1px solid #dbe2ea;border-radius:8px;outline:none;background:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.table th{background:#f8fafc;color:#334155}.empty{padding:35px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:12px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800}.footer{text-align:center;padding:28px;background:#0b1220;color:#94a3b8;margin-top:40px;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.top{display:none}.nav{padding:12px 4%;flex-direction:column;gap:10px}.wrap{width:92%;margin:22px auto}.grid,.form-grid{grid-template-columns:1fr}.hero{padding:25px}.hero h1{font-size:28px}}.task{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #e5e7eb}.task.done span{text-decoration:line-through;color:#94a3b8}.task span{flex:1}.del{border:0;background:#fee2e2;color:#991b1b;padding:7px 9px;border-radius:7px;cursor:pointer}</style></head><body><div class="top"><span>🎓 IGTR Student Hub</span><span>Assignments</span></div><nav class="nav"><a class="brand" href="student-tools.html"><span class="brand-icon">IG</span><span>Assignment Tracker</span></a><div class="navlinks"><a href="student-dashboard.html">Dashboard</a><a href="student-tools.html">Tools</a></div></nav><main class="wrap"><section class="hero"><span class="eyebrow">PERSONAL STUDY PLANNER</span><h1>Assignment Tracker</h1><p>Add assignments and mark them complete. Data is saved locally.</p></section><section class="section"><div class="form-grid"><div class="field"><label>Assignment</label><input id="title" placeholder="e.g. C++ Array Program"></div><div class="field"><label>Subject</label><input id="subject" placeholder="Subject"></div><div class="field"><label>Due Date</label><input id="due" type="date"></div></div><br><button class="btn" onclick="add()">+ Add Assignment</button></section><section class="section"><h2>My Tasks</h2><div id="list"></div></section></main><footer class="footer">Assignment data is stored locally in your browser.</footer><script>const key='igtrAssignments';function get(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return[]}}function save(a){localStorage.setItem(key,JSON.stringify(a));render()}function add(){const t=title.value.trim(),s=subject.value.trim(),d=due.value;if(!t)return alert('Enter assignment name.');const a=get();a.push({id:Date.now(),t,s,d,done:false});save(a);title.value='';subject.value='';due.value=''}function toggle(id){const a=get(),x=a.find(q=>q.id===id);if(x)x.done=!x.done;save(a)}function del(id){save(get().filter(q=>q.id!==id))}function render(){const a=get().sort((x,y)=>(x.done-y.done)||String(x.d).localeCompare(String(y.d)));list.innerHTML=a.length?a.map(x=>'<div class="task '+(x.done?'done':'')+'"><input type="checkbox" '+(x.done?'checked':'')+' onchange="toggle('+x.id+')"><span><b>'+x.t+'</b><br><small class="muted">'+(x.s||'No subject')+(x.d?' • Due '+x.d:'')+'</small></span><button class="del" onclick="del('+x.id+')">Delete</button></div>').join(''):'<div class="empty">No assignments added yet.</div>'}render()</script></body></html>

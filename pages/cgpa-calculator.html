<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CGPA Calculator | IGTR</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}body{background:#f4f7fb;color:#172033}.top{background:#0b1220;color:#cbd5e1;padding:11px 5%;font-size:12px;display:flex;justify-content:space-between}.nav{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#172033;font-weight:800}.brand-icon{width:40px;height:40px;border-radius:10px;background:#123c69;color:#fff;display:grid;place-items:center}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.navlinks a{background:#f1f5f9;color:#123c69;padding:9px 12px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700}.wrap{width:min(1180px,92%);margin:32px auto}.hero{background:linear-gradient(135deg,#102d4d,#123c69,#18578e);color:#fff;padding:35px;border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.12);margin-bottom:24px}.hero .eyebrow{font-size:11px;letter-spacing:1.6px;color:#b9dcfb;font-weight:800}.hero h1{font-size:clamp(28px,4vw,44px);margin:10px 0}.hero p{color:#dbeafe;line-height:1.7;max-width:780px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:22px;box-shadow:0 5px 18px rgba(0,0,0,.05);transition:.2s}.card:hover{transform:translateY(-3px);border-color:#2563eb}.card .icon{font-size:30px;margin-bottom:12px}.card h3{font-size:18px;margin-bottom:7px}.card p{font-size:13px;color:#64748b;line-height:1.6}.btn{display:inline-block;border:0;background:#123c69;color:#fff;padding:10px 15px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;cursor:pointer}.secondary{background:#eef4fa!important;color:#123c69!important}.section{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:22px;margin-top:20px}.section h2{font-size:21px;margin-bottom:15px}.muted{color:#64748b;font-size:13px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#475569}.field input{width:100%;padding:11px;border:1px solid #dbe2ea;border-radius:8px;outline:none;background:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.table th{background:#f8fafc;color:#334155}.empty{padding:35px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:12px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800}.footer{text-align:center;padding:28px;background:#0b1220;color:#94a3b8;margin-top:40px;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.top{display:none}.nav{padding:12px 4%;flex-direction:column;gap:10px}.wrap{width:92%;margin:22px auto}.grid,.form-grid{grid-template-columns:1fr}.hero{padding:25px}.hero h1{font-size:28px}}.rows{display:grid;gap:10px}.calc{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.out{margin-top:18px;padding:20px;background:#eff6ff;border-radius:12px}@media(max-width:600px){.calc{grid-template-columns:1fr}}</style></head><body><div class="top"><span>🎓 IGTR Student Hub</span><span>CGPA Calculator</span></div><nav class="nav"><a class="brand" href="student-tools.html"><span class="brand-icon">IG</span><span>CGPA Calculator</span></a><div class="navlinks"><a href="student-dashboard.html">Dashboard</a><a href="student-tools.html">Tools</a></div></nav><main class="wrap"><section class="hero"><span class="eyebrow">ACADEMIC TOOL</span><h1>SGPA / CGPA Calculator</h1><p>Enter credits and grade points. Use your official institute grading scheme.</p></section><section class="section"><h2>Subjects</h2><div id="rows" class="rows"></div><br><button class="btn" onclick="addRow()">+ Add Subject</button> <button class="btn secondary" onclick="calculate()">Calculate</button><div id="out" class="out" style="display:none"></div></section></main><footer class="footer">Weighted average = Σ(Credit × Grade Point) ÷ Σ(Credit).</footer><script>const box=document.getElementById('rows');function addRow(){const d=document.createElement('div');d.className='calc';d.innerHTML='<input placeholder="Subject name"><input class="credit" type="number" min="0" step="0.5" placeholder="Credit"><input class="gp" type="number" min="0" max="10" step="0.01" placeholder="Grade point">';box.appendChild(d)}for(let i=0;i<5;i++)addRow();function calculate(){let c=0,p=0;document.querySelectorAll('.calc').forEach(r=>{const a=Number(r.querySelector('.credit').value),g=Number(r.querySelector('.gp').value);if(a>0&&g>=0){c+=a;p+=a*g}});out.style.display='block';out.innerHTML=c?'<b>Calculated SGPA: '+(p/c).toFixed(2)+'</b><br><span class="muted">Total Credits: '+c+' • Weighted Grade Points: '+p.toFixed(2)+'</span>':'Enter at least one valid credit and grade point.'}</script></body></html>

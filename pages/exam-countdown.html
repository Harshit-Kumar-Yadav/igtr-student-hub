<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Countdown | IGTR</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}body{background:#f4f7fb;color:#172033}.top{background:#0b1220;color:#cbd5e1;padding:11px 5%;font-size:12px;display:flex;justify-content:space-between}.nav{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#172033;font-weight:800}.brand-icon{width:40px;height:40px;border-radius:10px;background:#123c69;color:#fff;display:grid;place-items:center}.navlinks{display:flex;gap:8px;flex-wrap:wrap}.navlinks a{background:#f1f5f9;color:#123c69;padding:9px 12px;border-radius:8px;text-decoration:none;font-size:12px;font-weight:700}.wrap{width:min(1180px,92%);margin:32px auto}.hero{background:linear-gradient(135deg,#102d4d,#123c69,#18578e);color:#fff;padding:35px;border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.12);margin-bottom:24px}.hero .eyebrow{font-size:11px;letter-spacing:1.6px;color:#b9dcfb;font-weight:800}.hero h1{font-size:clamp(28px,4vw,44px);margin:10px 0}.hero p{color:#dbeafe;line-height:1.7;max-width:780px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:22px;box-shadow:0 5px 18px rgba(0,0,0,.05);transition:.2s}.card:hover{transform:translateY(-3px);border-color:#2563eb}.card .icon{font-size:30px;margin-bottom:12px}.card h3{font-size:18px;margin-bottom:7px}.card p{font-size:13px;color:#64748b;line-height:1.6}.btn{display:inline-block;border:0;background:#123c69;color:#fff;padding:10px 15px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px;cursor:pointer}.secondary{background:#eef4fa!important;color:#123c69!important}.section{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:22px;margin-top:20px}.section h2{font-size:21px;margin-bottom:15px}.muted{color:#64748b;font-size:13px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px;color:#475569}.field input{width:100%;padding:11px;border:1px solid #dbe2ea;border-radius:8px;outline:none;background:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.table th{background:#f8fafc;color:#334155}.empty{padding:35px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:12px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:800}.footer{text-align:center;padding:28px;background:#0b1220;color:#94a3b8;margin-top:40px;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.top{display:none}.nav{padding:12px 4%;flex-direction:column;gap:10px}.wrap{width:92%;margin:22px auto}.grid,.form-grid{grid-template-columns:1fr}.hero{padding:25px}.hero h1{font-size:28px}}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:20px}.time{background:#f8fafc;border-radius:14px;padding:22px;text-align:center}.time b{display:block;font-size:34px;color:#123c69}.time span{font-size:11px;color:#64748b}@media(max-width:600px){.count{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><span>🎓 IGTR Student Hub</span><span>Exam Countdown</span></div><nav class="nav"><a class="brand" href="student-tools.html"><span class="brand-icon">IG</span><span>Exam Countdown</span></a><div class="navlinks"><a href="student-dashboard.html">Dashboard</a><a href="student-tools.html">Tools</a></div></nav><main class="wrap"><section class="hero"><span class="eyebrow">EXAM PLANNER</span><h1 id="heading">Set Your Exam Countdown</h1><p>Choose a future date and time. The countdown updates automatically.</p></section><section class="section"><div class="form-grid"><div class="field"><label>Exam / Event Name</label><input id="name" placeholder="Semester Exam"></div><div class="field"><label>Date & Time</label><input id="date" type="datetime-local"></div><div><label>&nbsp;</label><button class="btn" onclick="start()">Start Countdown</button></div></div><div id="count" class="count" style="display:none"><div class="time"><b id="d">0</b><span>DAYS</span></div><div class="time"><b id="h">0</b><span>HOURS</span></div><div class="time"><b id="m">0</b><span>MINUTES</span></div><div class="time"><b id="s">0</b><span>SECONDS</span></div></div><p id="msg" class="muted" style="margin-top:15px"></p></section></main><footer class="footer">Countdown is a local planning tool.</footer><script>let timer;function start(){const n=name.value.trim()||'Exam',v=date.value;if(!v)return alert('Choose a date and time.');if(new Date(v).getTime()<=Date.now())return alert('Choose a future date.');localStorage.setItem('igtrExam',JSON.stringify({n,v}));run()}function run(){const x=JSON.parse(localStorage.getItem('igtrExam')||'null');if(!x)return;heading.textContent=x.n;date.value=x.v;clearInterval(timer);count.style.display='grid';timer=setInterval(()=>{let diff=new Date(x.v).getTime()-Date.now();if(diff<=0){clearInterval(timer);msg.textContent='Exam time reached.';return}d.textContent=Math.floor(diff/86400000);h.textContent=Math.floor(diff%86400000/3600000);m.textContent=Math.floor(diff%3600000/60000);s.textContent=Math.floor(diff%60000/1000)},1000)}run()</script></body></html>
